<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fluxos na máquina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/nav.css">
<link rel="stylesheet" href="css/ar.css">
</head>
<body>

<div id="demo"></div>
<div id="ar" hidden></div>

<header class="top">
  <div class="brand-row">
    <nav class="pages" id="pages" aria-label="Páginas">
      <button class="menu-btn" id="menu-open" aria-label="Menu" aria-expanded="false" aria-controls="page-links"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="page-links" id="page-links">
        <a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linejoin="round"><path d="M12 3 4 7.5v9L12 21l8-4.5v-9z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/></svg>Tour 3D</a>
        <a href="ar.html" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 16 5-5 4 4 3-3 6 6"/><circle cx="16" cy="9" r="1.5"/></svg>Nas fotos (AR)</a>
      </div>
    </nav>
    <div class="brand">
      <h1>Fluxos na máquina</h1>
      <p>Protótipo · fotos reais</p>
    </div>
  </div>
  <div class="mode" role="group" aria-label="Modo">
    <button id="mode-demo" aria-pressed="true">Sem câmera</button>
    <button id="mode-ar" aria-pressed="false">Usar câmera</button>
  </div>
</header>

<section class="sheet">
  <div class="card" aria-live="polite">
    <div class="eyebrow" id="eyebrow">Foto 1 de 4</div>
    <h2 id="title"></h2>
    <p id="text"></p>
    <div class="legend" id="legend"></div>
    <div class="tabs" id="tabs" role="group" aria-label="Escolher foto"></div>
    <div class="msg" id="msg"></div>
  </div>
</section>


<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

// ---------- As 4 fotos (mesma ordem do arquivo alvos.mind) ----------
// Coordenadas em pixels da foto original (474 de largura); z = quanto o fluxo sai da foto, em larguras da foto.
const COL = {
  outside: new THREE.Color(0xc4d0d6), cold: new THREE.Color(0x4fd2ff), hot: new THREE.Color(0xff8a3d),
  water: new THREE.Color(0x3f8cff), ret: new THREE.Color(0xff4d3d),
};
const LEG = {
  outside: ["Ar da rua", "var(--outside)"], cold: ["Ar frio", "var(--cold)"], hot: ["Ar quente", "var(--hot)"],
  water: ["Água gelada", "var(--water)"], ret: ["Água de retorno", "var(--return)"],
};
const rnd = (a, b) => a + Math.random() * (b - a);

const TARGETS = [
  {
    file: "alvos/1-telhado.jpg", w: 474, h: 316, tab: "Telhado",
    title: "Chillers no telhado",
    text: "Os ventiladores em cima puxam o ar da rua pelas serpentinas em V. O ar leva o calor da água e sai quente para cima. A água gelada desce pela tubulação até a sala.",
    legend: ["outside", "hot", "water", "ret"],
    flows(add) {
      for (let i = 0; i < 12; i++) {
        const x = 95 + i * 19 + rnd(-6, 6), y = rnd(128, 158);
        add([[x - 20, y + 25, 0.3], [x, y, 0.06], [x + 4, y - 25, 0.02], [x + 6, 92, 0.01], [x + rnd(-10, 10), -40, 0.03]], COL.outside, COL.hot, [0.42, 0.62]);
      }
      for (const dx of [0, 6]) {
        add([[290 + dx, 150, 0.01], [315 + dx, 140, 0.02], [322 + dx, 200, 0.02], [328 + dx, 262, 0.02]], COL.water, COL.water);
      }
      add([[340, 262, 0.02], [334, 200, 0.02], [328, 142, 0.02], [300, 158, 0.01]], COL.ret, COL.ret);
    },
  },
  {
    file: "alvos/2-chiller.jpg", w: 474, h: 316, tab: "Chiller",
    title: "Chiller resfriado a ar",
    text: "Cada V da lateral é uma serpentina com a água do data center. O ar da rua passa por ela, esquenta e é jogado para cima pelos ventiladores do topo.",
    legend: ["outside", "hot", "water", "ret"],
    flows(add) {
      for (let i = 0; i < 12; i++) {
        const x = 240 + i * 19 + rnd(-6, 6), y = rnd(140, 192);
        add([[x - 30, y + 30, 0.3], [x, y, 0.05], [x + 3, y - 40, 0.02], [x + 4, 92, 0.01], [x + rnd(-10, 10), -50, 0.03]], COL.outside, COL.hot, [0.42, 0.62]);
      }
      add([[440, 238, 0.02], [380, 240, 0.02], [320, 240, 0.02], [250, 238, 0.02]], COL.water, COL.water);
      add([[250, 252, 0.02], [320, 254, 0.02], [380, 254, 0.02], [440, 252, 0.02]], COL.ret, COL.ret);
    },
  },
  {
    file: "alvos/3-sala.jpg", w: 474, h: 355, tab: "Sala",
    title: "Ar-condicionado da sala (CRAH)",
    text: "O CRAH sopra o ar frio por baixo do piso elevado. O ar sobe pelas placas perfuradas, entra pela frente dos racks e o ar quente volta por cima até o CRAH.",
    legend: ["cold", "hot"],
    flows(add) {
      for (let i = 0; i < 12; i++) {
        const x = 185 + i * 14 + rnd(-5, 5);
        add([[265, 262, 0], [265 + (x - 265) * 0.4, 290, 0.03], [x, 335, 0.1], [x, 300, 0.2], [x + rnd(-8, 8), 210, 0.26]], COL.cold, COL.cold);
      }
      for (const s of [-1, 1]) for (let i = 0; i < 7; i++) {
        const y = rnd(170, 255), x0 = 265 + s * rnd(10, 40);
        add([[x0, y + 40, 0.2], [265 + s * 70, y, 0.12], [265 + s * 120, y - 5, 0.06], [265 + s * 175, y - 10, 0.03]], COL.cold, COL.hot, [0.7, 0.95]);
      }
      for (const s of [-1, 1]) for (let i = 0; i < 6; i++) {
        const x0 = 265 + s * rnd(150, 230);
        add([[x0, rnd(60, 120), 0.04], [265 + s * 120, 70, 0.06], [265 + s * 50, 125, 0.04], [265 + s * 10, 145, 0.01]], COL.hot, COL.hot);
      }
    },
  },
  {
    file: "alvos/4-corredor-quente.jpg", w: 474, h: 631, tab: "Corredor quente",
    title: "Corredor quente fechado",
    text: "O ar sai quente pela parte de trás dos servidores, fica preso no corredor fechado e sobe pelas grelhas do forro, de volta ao ar-condicionado da sala.",
    legend: ["hot"],
    flows(add) {
      for (let i = 0; i < 16; i++) {
        const y = rnd(300, 580), x = rnd(110, 200), xt = rnd(230, 400);
        add([[x, y, 0.02], [x + 90, y - 30, 0.08], [rnd(280, 380), (y + 120) / 2, 0.1], [xt, 110, 0.05], [xt + rnd(-10, 10), 10, 0.02]], COL.hot, COL.hot);
      }
    },
  },
];

// ---------- Fluxos: partículas correndo por curvas ----------
const sprite = (() => {
  const c = document.createElement("canvas"); c.width = c.height = 64;
  const g = c.getContext("2d"); const r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  r.addColorStop(0, "rgba(255,255,255,1)"); r.addColorStop(0.4, "rgba(255,255,255,.8)"); r.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = r; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c);
})();

const overlays = [];
function buildOverlay(t) {
  const group = new THREE.Group();
  const paths = [];
  const toLocal = ([px, py, z]) => new THREE.Vector3(px / t.w - 0.5, (t.h / 2 - py) / t.w, z);
  t.flows((pts, c0, c1, range = [0.45, 0.55]) => {
    const curve = new THREE.CatmullRomCurve3(pts.map(toLocal), false, "centripetal");
    const len = curve.getLength(), lut = curve.getSpacedPoints(160);
    paths.push({ len, lut, c0, c1, range, count: Math.max(8, Math.round(len * 34)) });
    const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(lut),
      new THREE.LineBasicMaterial({ color: c0.clone().lerp(c1, 0.5), transparent: true, opacity: 0.35, depthWrite: false }));
    group.add(line);
  });
  const seeds = [];
  for (const p of paths) for (let k = 0; k < p.count; k++) seeds.push({ p, off: k / p.count });
  const pos = new Float32Array(seeds.length * 3), col = new Float32Array(seeds.length * 3), alpha = new Float32Array(seeds.length);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
  const points = new THREE.Points(geo, new THREE.PointsMaterial({
    size: 0.022, map: sprite, vertexColors: true, transparent: true, depthWrite: false, sizeAttenuation: true,
  }));
  points.frustumCulled = false;
  group.add(points);
  group.userData.points = points;
  const tmp = new THREE.Color();
  const speed = 0.16; // larguras da foto por segundo
  group.userData.update = time => {
    seeds.forEach((s, i) => {
      const p = s.p, u = (s.off + (time * speed) / p.len) % 1;
      const f = u * (p.lut.length - 1), i0 = Math.floor(f), a = p.lut[i0], b = p.lut[Math.min(i0 + 1, p.lut.length - 1)], w = f - i0;
      pos[i * 3] = a.x + (b.x - a.x) * w; pos[i * 3 + 1] = a.y + (b.y - a.y) * w; pos[i * 3 + 2] = a.z + (b.z - a.z) * w;
      const k = THREE.MathUtils.clamp((u - p.range[0]) / (p.range[1] - p.range[0]), 0, 1);
      const fade = Math.min(1, u * 6, (1 - u) * 6);
      tmp.copy(p.c0).lerp(p.c1, k).multiplyScalar(0.25 + 0.75 * fade);
      col[i * 3] = tmp.r; col[i * 3 + 1] = tmp.g; col[i * 3 + 2] = tmp.b;
    });
    geo.attributes.position.needsUpdate = true; geo.attributes.color.needsUpdate = true;
  };
  return group;
}

// ---------- Painel ----------
const $ = id => document.getElementById(id);
let current = 0, mode = "demo";
function showInfo(i, found = true) {
  const t = TARGETS[i];
  $("eyebrow").textContent = `Foto ${i + 1} de ${TARGETS.length}`;
  $("title").textContent = t.title; $("text").textContent = t.text;
  $("legend").innerHTML = t.legend.map(k => `<span><i style="background:${LEG[k][1]}"></i>${LEG[k][0]}</span>`).join("");
  [...$("tabs").children].forEach((b, k) => b.setAttribute("aria-pressed", k === i ? "true" : "false"));
}
function waiting() {
  $("eyebrow").textContent = "Câmera ligada";
  $("title").textContent = "Aponte para uma das fotos";
  $("text").textContent = "Mostre na tela ou no slide uma das 4 fotos (telhado, chiller, sala ou corredor quente). Os fluxos aparecem em cima dela.";
  $("legend").innerHTML = "";
}
TARGETS.forEach((t, i) => {
  const b = document.createElement("button"); b.textContent = t.tab;
  b.addEventListener("click", () => selectDemo(i)); $("tabs").appendChild(b);
});

// ---------- Modo sem câmera: a foto em 3D com os fluxos ----------
const demoEl = $("demo");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x0b1418);
demoEl.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.01, 50);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.enablePan = false;
controls.minAzimuthAngle = -0.9; controls.maxAzimuthAngle = 0.9;
controls.minPolarAngle = 0.6; controls.maxPolarAngle = 2.2;
controls.minDistance = 0.6; controls.maxDistance = 4;
const loader = new THREE.TextureLoader();
const demoGroups = TARGETS.map(t => {
  const g = new THREE.Group();
  const tex = loader.load(t.file); tex.colorSpace = THREE.SRGBColorSpace;
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(1, t.h / t.w), new THREE.MeshBasicMaterial({ map: tex }));
  g.add(plane);
  const ov = buildOverlay(t); g.add(ov); overlays.push(ov);
  g.visible = false; scene.add(g); return g;
});
let userMoved = false;
controls.addEventListener("start", () => { userMoved = true; });
function frameDemo() {
  const t = TARGETS[current], aspect = window.innerWidth / window.innerHeight;
  const hImg = t.h / t.w;
  // distância para a foto caber acima do painel
  const fit = Math.max(hImg / 0.62, 1 / (0.92 * aspect));
  const dist = (fit / 2) / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  camera.position.set(0, -0.05, dist); controls.target.set(0, 0, 0); userMoved = false;
}
function selectDemo(i) {
  current = i; demoGroups.forEach((g, k) => { g.visible = k === i; });
  showInfo(i); frameDemo();
  setHash("foto-" + (i + 1));
}
function resizeDemo() {
  camera.aspect = window.innerWidth / window.innerHeight;
  const card = document.querySelector(".card");
  const shift = card ? card.getBoundingClientRect().height * 0.5 : 0;
  camera.setViewOffset(window.innerWidth, window.innerHeight, 0, shift, window.innerWidth, window.innerHeight);
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener("resize", () => { resizeDemo(); frameDemo(); });
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const clock = new THREE.Clock();
function demoLoop() {
  if (mode !== "demo") return;
  const time = clock.getElapsedTime();
  overlays[current].userData.update(time);
  // leve balanço para mostrar que os fluxos saem da foto
  if (!userMoved && !reduce) {
    const d = camera.position.length();
    const yaw = Math.sin(time * 0.35) * 0.32;
    camera.position.set(Math.sin(yaw) * d, -0.05, Math.cos(yaw) * d);
  }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(demoLoop);
}

// ---------- Modo câmera (MindAR, rastreando as fotos) ----------
let mindar = null;
const wscale = new THREE.Vector3();
async function startAR() {
  $("msg").className = "msg"; $("msg").textContent = "Abrindo a câmera...";
  try {
    if (!mindar) {
      const { MindARThree } = await import("https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js");
      mindar = new MindARThree({
        container: $("ar"), imageTargetSrc: "alvos.mind", maxTrack: 1,
        uiLoading: "no", uiScanning: "no", uiError: "no", filterMinCF: 0.0001, filterBeta: 0.001,
      });
      mindar.overlays = TARGETS.map((t, i) => {
        const anchor = mindar.addAnchor(i);
        const ov = buildOverlay(t); anchor.group.add(ov);
        anchor.onTargetFound = () => { current = i; showInfo(i); $("msg").textContent = ""; };
        anchor.onTargetLost = () => { waiting(); };
        return ov;
      });
    }
    $("ar").hidden = false;
    await mindar.start();
    $("msg").textContent = "";
    waiting();
    mindar.renderer.setAnimationLoop(() => {
      const time = clock.getElapsedTime();
      mindar.overlays.forEach(o => {
        // o tamanho dos pontos não acompanha a escala da âncora; corrige aqui
        o.getWorldScale(wscale); o.userData.points.material.size = 0.022 * wscale.x;
        o.userData.update(time);
      });
      mindar.renderer.render(mindar.scene, mindar.camera);
    });
  } catch (e) {
    console.error(e);
    $("msg").className = "msg err";
    $("msg").textContent = "Não foi possível abrir a câmera. Confira se a página está em https e se a permissão da câmera foi liberada.";
    setMode("demo");
  }
}
function stopAR() {
  if (!mindar) return;
  mindar.renderer.setAnimationLoop(null);
  try { mindar.stop(); } catch (e) { /* já parado */ }
  $("ar").hidden = true;
}

function setMode(m) {
  if (m === mode) return;
  mode = m;
  $("mode-demo").setAttribute("aria-pressed", m === "demo"); $("mode-ar").setAttribute("aria-pressed", m === "ar");
  $("tabs").hidden = m === "ar";
  demoEl.hidden = m === "ar";
  if (m === "ar") { startAR(); setHash("camera"); }
  else { stopAR(); selectDemo(current); demoLoop(); }
}
// #foto-1 a #foto-4 ou #camera, vindos do menu ou de um link direto
function route(h) {
  const m = /^#foto-([1-4])$/.exec(h);
  if (h === "#camera") setMode("ar");
  else if (m) { setMode("demo"); selectDemo(+m[1] - 1); }
}
$("mode-demo").addEventListener("click", () => setMode("demo"));
$("mode-ar").addEventListener("click", () => setMode("ar"));
window.addEventListener("keydown", e => {
  if (mode !== "demo") return;
  if (e.key === "ArrowRight") selectDemo((current + 1) % TARGETS.length);
  if (e.key === "ArrowLeft") selectDemo((current + TARGETS.length - 1) % TARGETS.length);
});

// ---------- Navegação entre páginas (hambúrguer no celular) ----------
const pages = $("pages");
$("menu-open").addEventListener("click", e => {
  e.stopPropagation();
  $("menu-open").setAttribute("aria-expanded", pages.classList.toggle("open"));
});
const closeMenu = () => { pages.classList.remove("open"); $("menu-open").setAttribute("aria-expanded", "false"); };
// a página atual não recarrega, só fecha o menu
pages.querySelector("[aria-current=page]").addEventListener("click", e => { e.preventDefault(); closeMenu(); });
document.addEventListener("click", e => { if (!pages.contains(e.target)) closeMenu(); });
window.addEventListener("keydown", e => { if (e.key === "Escape") closeMenu(); });
// guarda o passo/foto no endereço, para links diretos (#passo-3, #foto-2...)
const setHash = key => history.replaceState(null, "", "#" + key);
window.addEventListener("hashchange", () => route(location.hash));

const startHash = location.hash; // selectDemo(0) troca o hash, então guarda o do link antes
selectDemo(0);
resizeDemo(); frameDemo();
demoLoop();
route(startHash);
</script>
</body>
</html>
