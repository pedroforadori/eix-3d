<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tour do resfriamento</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/nav.css">
<link rel="stylesheet" href="css/tour.css">
</head>
<body>

<div id="stage"></div>
<div class="loading" id="loading">Carregando a cena 3D...</div>
<div class="labels" id="labels"></div>

<header class="top">
  <div class="brand-row">
    <nav class="pages" id="pages" aria-label="Páginas">
      <button class="menu-btn" id="menu-open" aria-label="Menu" aria-expanded="false" aria-controls="page-links"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="page-links" id="page-links">
        <a href="index.html" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linejoin="round"><path d="M12 3 4 7.5v9L12 21l8-4.5v-9z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/></svg>Tour 3D</a>
        <a href="ar.html"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 16 5-5 4 4 3-3 6 6"/><circle cx="16" cy="9" r="1.5"/></svg>Nas fotos (AR)</a>
      </div>
    </nav>
    <div class="brand">
      <h1>Tour do resfriamento</h1>
      <p>Protótipo · data center</p>
    </div>
  </div>
  <div class="mode" role="group" aria-label="Modo de visualização">
    <button id="mode-steps" aria-pressed="true">Passo a passo</button>
    <button id="mode-all" aria-pressed="false">Ciclo completo</button>
  </div>
</header>

<div class="legend" aria-label="Legenda">
  <span><i style="background:var(--outside)"></i>Ar da rua</span>
  <span><i style="background:var(--cold)"></i>Ar frio</span>
  <span><i style="background:var(--hot)"></i>Ar quente</span>
  <span><i style="background:var(--water)"></i>Água gelada</span>
  <span><i style="background:var(--return)"></i>Água de retorno</span>
</div>

<section class="sheet">
  <div class="card" aria-live="polite">
    <div class="eyebrow" id="eyebrow">Visão geral</div>
    <h2 id="title">Como o data center se mantém frio</h2>
    <p id="text"></p>
    <div class="temps" id="temps"></div>
    <div class="nav">
      <button class="btn" id="prev">Anterior</button>
      <div class="dots" id="dots"></div>
      <button class="btn primary" id="next">Próximo</button>
    </div>
    <div class="note">Arraste para girar · pinça ou roda para aproximar · temperaturas típicas, ilustrativas</div>
  </div>
</section>


<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module" src="js/tour/main.js"></script>
</body>
</html>
