<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="tourDocTitle">Cooling tour</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/nav.css">
<link rel="stylesheet" href="css/tour.css">
</head>
<body>

<div id="stage"></div>
<div class="loading" id="loading" data-i18n="loading">Loading the 3D scene...</div>
<div class="labels" id="labels"></div>

<header class="top">
  <div class="brand-row">
    <nav class="pages" id="pages" aria-label="Pages" data-i18n-aria="pages">
      <button class="menu-btn" id="menu-open" aria-label="Menu" data-i18n-aria="menu" aria-expanded="false" aria-controls="page-links"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="menu-panel" id="page-links">
        <div class="page-links">
          <a href="index.html" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linejoin="round"><path d="M12 3 4 7.5v9L12 21l8-4.5v-9z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/></svg><span data-i18n="navTour">3D tour</span></a>
          <a href="ar.html"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 16 5-5 4 4 3-3 6 6"/><circle cx="16" cy="9" r="1.5"/></svg><span data-i18n="navAr">On the photos (AR)</span></a>
        </div>
        <div class="tools">
          <div class="lang" id="lang" role="group" aria-label="Language" data-i18n-aria="language">
            <button data-lang="pt" aria-pressed="false">PT</button>
            <button data-lang="en" aria-pressed="true">EN</button>
          </div>
          <div class="mode" role="group" aria-label="View mode" data-i18n-aria="viewMode">
            <button id="mode-steps" aria-pressed="true" data-i18n="modeSteps">Step by step</button>
            <button id="mode-all" aria-pressed="false" data-i18n="modeAll">Full cycle</button>
          </div>
        </div>
      </div>
    </nav>
    <div class="brand">
      <h1 data-i18n="tourTitle">Cooling tour</h1>
      <p data-i18n="tourSub">Prototype · data center</p>
    </div>
  </div>
  <button class="legend-btn" id="legend-btn" aria-label="Legend" data-i18n-aria="legend" aria-expanded="false" aria-controls="legend"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="3.2" fill="var(--hot)"/><circle cx="7" cy="16" r="3.2" fill="var(--cold)"/><circle cx="17" cy="16" r="3.2" fill="var(--water)"/></svg></button>
</header>

<div class="legend" id="legend" aria-label="Legend" data-i18n-aria="legend">
  <span><i style="background:var(--outside)"></i><span data-i18n="flowOutside">Outside air</span></span>
  <span><i style="background:var(--cold)"></i><span data-i18n="flowCold">Cold air</span></span>
  <span><i style="background:var(--hot)"></i><span data-i18n="flowHot">Hot air</span></span>
  <span><i style="background:var(--water)"></i><span data-i18n="flowWater">Chilled water</span></span>
  <span><i style="background:var(--return)"></i><span data-i18n="flowRet">Return water</span></span>
</div>

<section class="sheet">
  <div class="card" id="card" aria-live="polite">
    <div class="card-head" id="card-head">
      <div class="eyebrow" id="eyebrow">Overview</div>
      <h2 id="title">How the data center stays cool</h2>
      <button class="card-toggle" id="card-toggle" aria-expanded="false" aria-controls="card-more" aria-label="Show details" data-i18n-aria="details"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg></button>
    </div>
    <div class="card-more" id="card-more">
      <p id="text"></p>
      <div class="temps" id="temps"></div>
    </div>
    <div class="nav">
      <button class="btn" id="prev" data-i18n="prev">Previous</button>
      <div class="dots" id="dots"></div>
      <button class="btn primary" id="next">Next</button>
    </div>
    <div class="note" data-i18n="tourNote">Drag to rotate · pinch or scroll to zoom · typical temperatures, for illustration only</div>
  </div>
</section>


<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module" src="js/tour/main.js"></script>
</body>
</html>
